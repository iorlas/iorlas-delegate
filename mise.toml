# Dev tools, pinned exactly (88 sec 6). Install: `mise install`. The justfile reads these pins; CI installs the same versions with uv.
# Runtime needs none of them: the plugin runs on bare python3 (3.12+) and the standard library.
[tools]
uv = "0.13.0"
just = "1.58.0"
ruff = "0.17.2"
"pipx:pyrefly" = "1.4.0"
