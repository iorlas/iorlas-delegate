# Lint. `just check` runs `ruff check`.
target-version = "py312"
line-length = 140
output-format = "concise"
exclude = [".worktrees", ".slots", ".task", "tests/fixtures", "skills/delegate/_vendor"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C90", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913",  # argument count: deep functions legitimately take many
    "PLR2004",  # magic values
    "PLR0917",  # positional-argument count, same reason as PLR0913
]

[lint.mccabe]
max-complexity = 12

[lint.per-file-ignores]
